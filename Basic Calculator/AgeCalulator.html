<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>
  <style>
    /* --- Base Styling --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #fff;
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    /* --- Card --- */
    .container {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px 25px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    label {
      font-weight: 500;
      display: block;
      margin-top: 15px;
      color: #fff;
    }

    input {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.8);
    }

    button {
      margin-top: 20px;
      width: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #6b73ff, #000dff);
    }

    /* --- Results --- */
    #bottom {
      margin-top: 25px;
      display: none;
      animation: fadeIn 0.8s ease-in-out;
    }

    #bottom span {
      font-weight: 600;
      color: #fff;
    }

    #bottom p {
      margin-bottom: 10px;
      color: #f5f5f5;
      font-size: 15px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.3);
      margin: 15px 0;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>AGE CALCULATOR</h1>
    <div id="input">
      <form>
        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob" value="1970-01-01" />
        <label for="bd">Age At Date:</label>
        <input type="date" name="bd" id="bd" />
        <button type="button" onclick="cal()">Calculate</button>
      </form>
    </div>

    <div id="bottom">
      <div class="divider"></div>
      <span>Age:</span>
      <p id="age"></p>

      <span>Age in Months:</span>
      <p id="months"></p>

      <span>Age in Weeks:</span>
      <p id="weeks"></p>

      <span>Age in Days:</span>
      <p id="days"></p>

      <span>Age in Hours:</span>
      <p id="hours"></p>

      <span>Age in Minutes:</span>
      <p id="minutes"></p>

      <span>Age in Seconds:</span>
      <p id="seconds"></p>
    </div>
  </div>

  <script>
    // Default date setup
    const today = new Date();
    document.getElementById('bd').value = today.toISOString().split("T")[0];

    function cal() {
      const dob = document.getElementById('dob');
      const bd = document.getElementById('bd');

      if (dob.value === "") {
        alert("Please enter your Date of Birth!");
        return;
      } else if (dob.value > bd.value) {
        alert("Invalid Input: Birth date cannot be after the given date!");
        return;
      }

      document.getElementById('bottom').style.display = "block";

      const birth = new Date(dob.value);
      const given = new Date(bd.value);
      const diff = given - birth;

      const years = given.getFullYear() - birth.getFullYear();
      const months = years * 12 + (given.getMonth() - birth.getMonth());
      const weeks = Math.round(months * 4.345);
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = days * 24;
      const minutes = hours * 60;
      const seconds = minutes * 60;

      document.getElementById('age').textContent = `${years} Years`;
      document.getElementById('months').textContent = `${months} Months`;
      document.getElementById('weeks').textContent = `${weeks} Weeks`;
      document.getElementById('days').textContent = `${days} Days`;
      document.getElementById('hours').textContent = `${hours.toLocaleString()} Hours`;
      document.getElementById('minutes').textContent = `${minutes.toLocaleString()} Minutes`;
      document.getElementById('seconds').textContent = `${seconds.toLocaleString()} Seconds`;
    }
  </script>
</body>
</html>
